<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>小爱同学</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: radial-gradient(circle at center, #1b1024 0%, #050207 55%, #000000 100%);
      color: #ff8add;
      font-family: SimSun, "宋体", "Microsoft YaHei", sans-serif;
      overflow-x: hidden;
    }
    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 14px;
      box-sizing: border-box;
    }
    .card {
      width: min(94vw, 860px);
      text-align: center;
    }
    .title {
      font-size: 28px;
      line-height: 1.45;
      margin-bottom: 18px;
      color: #ff8add;
      text-shadow: 0 0 8px rgba(255, 105, 220, 0.95),
                   0 0 18px rgba(255, 70, 210, 0.65),
                   0 0 32px rgba(255, 60, 190, 0.35);
      letter-spacing: 1px;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 0 22px rgba(255, 80, 220, 0.38),
                  0 0 58px rgba(120, 60, 255, 0.22);
      background: #000;
    }
    video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
    }
    .hint {
      margin-top: 16px;
      font-size: 15px;
      color: rgba(255, 190, 238, 0.86);
      line-height: 1.7;
    }
    .play-button {
      display: inline-block;
      margin-top: 14px;
      padding: 10px 22px;
      border: 1px solid rgba(255, 138, 221, 0.7);
      border-radius: 999px;
      color: #ffd7f4;
      background: rgba(255, 88, 210, 0.14);
      text-shadow: 0 0 8px rgba(255, 80, 220, 0.8);
      box-shadow: 0 0 18px rgba(255, 80, 220, 0.24);
      cursor: pointer;
      user-select: none;
    }
    .note {
      margin-top: 10px;
      font-size: 12px;
      color: rgba(255, 210, 245, 0.62);
      line-height: 1.6;
      word-break: break-all;
    }
    @media (max-width: 520px) {
      .title {
        font-size: 20px;
      }
      .page {
        padding: 18px 10px;
      }
      .hint {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="title">小爱同学，希望未来的你、我、我们都幸福</div>
      <div class="video-wrap">
        <video id="heartVideo"
               controls
               playsinline
               webkit-playsinline
               preload="metadata">
          <source src="https://heart-video-xa-20260524-1436515141.cos.ap-beijing.myqcloud.com/heart_particle_reproduce.2.github.mp4" type="video/mp4">
          你的浏览器暂不支持视频播放。
        </video>
      </div>
      <div class="hint">
        请点击下方按钮或轻触视频画面播放。
        <br />
        <span class="play-button" onclick="playVideo()">播放爱心动画</span>
      </div>
      <div class="note">
        如果微信中无法播放，请点击右上角“...”选择在浏览器中打开。
      </div>
    </section>
  </main>
  <script>
    const video = document.getElementById("heartVideo");
    function playVideo() {
      video.muted = false;
      video.play().catch(() => {
        alert("请直接点击视频画面播放。");
      });
    }
  </script>
</body>
</html>
